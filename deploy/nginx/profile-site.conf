# Installed by hand (see README "Server setup"); scripts/deploy.sh never touches it.

# Language for a visitor arriving at `/`: Russian when it is the browser's
# first preferred language, otherwise the Default Language (en).
map $http_accept_language $profile_site_language {
    default en;
    "~*^ru" ru;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 4edorov.com;

    ssl_certificate /etc/letsencrypt/live/4edorov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4edorov.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/profile-site;
    charset utf-8;

    # Relative Location headers: correct behind TLS termination and on non-default ports.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/plain image/svg+xml;

    # HTML must be revalidated so a deploy is visible immediately.
    add_header Cache-Control "no-cache" always;

    location = / {
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-cache" always;
        return 302 /$profile_site_language/;
    }

    # Language roots keep their trailing slash: /en -> /en/
    location ~ ^/(en|ru)$ {
        return 301 /$1/;
    }

    # React Router's SPA fallback, which no Page uses: it has no title, canonical URL or noindex.
    location = /index.html {
        error_page 404 /404/index.html;
        return 404;
    }

    # add_header here drops the server-level Cache-Control, so it is repeated.
    location ~ \.data$ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Content-hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /ru/ {
        error_page 404 /ru/404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }

    location /en/ {
        error_page 404 /en/404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }

    # Unknown paths outside the Language prefixes.
    location / {
        error_page 404 /404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.4edorov.com;

    ssl_certificate /etc/letsencrypt/live/4edorov.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4edorov.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://4edorov.com$request_uri;
}

# Certbot renewal reaches the domain over http through this block.
server {
    listen 80;
    listen [::]:80;
    server_name 4edorov.com www.4edorov.com;

    return 301 https://4edorov.com$request_uri;
}
