# nginx site config for the Profile Site. Installed manually on the server
# (see README "Server setup"); scripts/deploy.sh never touches it.
#
# Replace `profile.example.com` with the real domain and `/var/www/profile-site`
# with DEPLOY_PATH from .env.deploy. TLS (certificates, the :443 listener and
# the http -> https redirect) is left to the server's existing setup.

# Language for a visitor arriving at `/`: Russian when it is the browser's
# first preferred language, otherwise the Default Language (en).
map $http_accept_language $profile_site_language {
    default en;
    "~*^ru" ru;
}

server {
    listen 80;
    server_name profile.example.com;

    root /var/www/profile-site;
    charset utf-8;

    # Relative Location headers: correct behind TLS termination and on non-default ports.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/plain image/svg+xml;

    # HTML must be revalidated so a deploy is visible immediately.
    add_header Cache-Control "no-cache" always;

    location = / {
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-cache" always;
        return 302 /$profile_site_language/;
    }

    # Language roots keep their trailing slash: /en -> /en/
    location ~ ^/(en|ru)$ {
        return 301 /$1/;
    }

    # Content-hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /ru/ {
        error_page 404 /ru/404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }

    location /en/ {
        error_page 404 /en/404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }

    # Unknown paths outside the Language prefixes.
    location / {
        error_page 404 /404/index.html;
        include /etc/nginx/snippets/profile-site-pages.conf;
    }
}
