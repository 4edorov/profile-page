# Shared by every Language location in profile-site.conf. Install to
# /etc/nginx/snippets/profile-site-pages.conf.

# Canonical Page URLs have no trailing slash (except Language roots).
rewrite ^/([^/]+/.+)/$ /$1 permanent;

# Prerendered Pages live at <path>/index.html.
try_files $uri $uri/index.html =404;
